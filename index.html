<script>
const sheetId = "13FzbI2Ka7xwscxTQjx_4P7hhYh7p07Nllt-YLDX_4jg";
const sheetName = "Form Responses 1";

const url = `https://opensheet.elk.sh/${sheetId}/${sheetName}`;
<div id="players"></div>
fetch(url)
.then(r => r.json())
.then(data => {

    const container = document.getElementById("players");
    container.innerHTML = "";

    data.forEach(team => {

        const values = Object.values(team);

        container.innerHTML += `
        <div class="player">
            <b>${values[1] || ""}</b><br>
            ${values[2] || ""}
        </div>
        `;
    });

})
.catch(err => {
    document.getElementById("players").innerHTML =
        "Error: " + err;
});
</script>
